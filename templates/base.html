<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{{ ctf_name }}{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <style>
    :root {
      --navy: #003366;
      --gold:  #c9a84c;
    }
    body { background: #f4f6fb; }
    .sb-navbar {
      background: var(--navy);
    }
    .sb-navbar .nav-link, .sb-navbar .navbar-brand {
      color: #fff !important;
    }
    .sb-navbar .nav-link:hover { color: var(--gold) !important; }
    .sb-navbar .nav-link.active { color: var(--gold) !important; font-weight: 600; }
    .card { border: none; border-radius: 12px; box-shadow: 0 2px 12px rgba(0,0,0,.07); }
    .btn-primary  { background: var(--navy); border-color: var(--navy); }
    .btn-primary:hover { background: #00244d; border-color: #00244d; }
    .badge-correct   { background: #d1fae5; color: #065f46; padding: 3px 10px; border-radius: 20px; font-size:.8rem; }
    .badge-wrong     { background: #fee2e2; color: #991b1b; padding: 3px 10px; border-radius: 20px; font-size:.8rem; }
    .badge-blank     { background: #f1f5f9; color: #64748b; padding: 3px 10px; border-radius: 20px; font-size:.8rem; }
    .score-hero { background: var(--navy); color: #fff; border-radius: 16px; }
    .score-hero .big { font-size: 3.5rem; font-weight: 700; color: var(--gold); line-height: 1; }
    .rank-1 { background: #fef9c3; }
    .rank-2 { background: #f1f5f9; }
    .rank-3 { background: #fff7ed; }
  </style>
</head>
<body>

<nav class="navbar navbar-expand-lg sb-navbar px-4 py-2">
  <a class="navbar-brand fw-bold fs-5" href="/">
    <i class="bi bi-bank2 me-2"></i>{{ ctf_name }}
  </a>
  <div class="ms-auto d-flex gap-3">
    <a href="/" class="nav-link {% if request.path=='/' %}active{% endif %}">
      <i class="bi bi-flag me-1"></i>Submit
    </a>
    <a href="/leaderboard" class="nav-link {% if 'leaderboard' in request.path %}active{% endif %}">
      <i class="bi bi-trophy me-1"></i>Leaderboard
    </a>
  </div>
</nav>

<div class="container py-5" style="max-width:820px">
  {% block content %}{% endblock %}
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
